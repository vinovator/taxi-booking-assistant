# Look and feel of the web UI (streamlit run streamlit_app.py). Safe to commit: no secrets here.

[theme]
base = "light"
primaryColor = "#1D4ED8"                    # buttons, links and focus rings
backgroundColor = "#F3F5FA"                 # page background, behind the white panels
secondaryBackgroundColor = "#F5F7FB"        # text boxes, chat bubbles and code
textColor = "#0F172A"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
baseRadius = "0.65rem"
buttonRadius = "full"
showWidgetBorder = true
headingFontWeights = [700, 700, 650, 650, 600, 600]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FA"

[client]
toolbarMode = "minimal"                     # hide developer options in the app menu

[browser]
gatherUsageStats = false
